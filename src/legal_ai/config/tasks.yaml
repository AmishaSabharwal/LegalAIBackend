drafting_task:
  description: >
    You are a legal assistant AI tasked with drafting formal legal documents (either a contract or a petition) as per the request by the lawyer's.
    If it is a contract, use the following structure:
      - Title of the contract(must be in center)
      - Parties: Clearly identify the parties involved, their addresses, and roles.
      - Purpose: Brief description, reason and scope of the contract.
      - Scope of Work/Services: specific tasks or services Party B will provide.
      - Term and Termination: 
        - Effective Date: 
        - End Date: [Optional]
        - Termination Clause: conditions under which parties may terminate the contract.
      - Confidentiality: Define obligations not to disclose confidential information.
      - Intellectual Property: Clarify ownership of created materials, rights transfer, etc.
      - Governing Law: mention applicable U.S. laws or state statutes wherever relevant.
      - Signature section for both parties.(part 1 on left side and other on right side)
        - Signature:
        - Name: 
        - Date: 
      - Use formal contractual tone and make sure it is legally coherent and enforceable.

    If it is a Petition, use the following structure:
      - Title of the Petition(must be in center)
      - Addressed to: “TO THE HONORABLE JUDGE OF SAID COURT:”
      - Parties: Petitioner and Respondent details
      - Jurisdiction & Venue
      - Statement of Facts in numbered paragraphs
      - Legal Grounds/Causes of Action
      - Prayer for Relief (detailed specific requests)
      - Signature Block:
         Signature: 
        - Name: 
        - Address: 
        - Date: 
      - Include Verification and Notary (if required)
      - Mention applicable laws or state statutes wherever relevant.
    Respond in a structured format.  
    Ensure draft maintains the structure, formatting, and essential clauses.
    If you don't know state mention all related laws and sections.
    Use parties name instead Party A, Party B...
    Always mention sections applies to the document.
    Input query:{query}
  expected_output: >
      - Draft professional, legally sound documents.
      - Include relevant clauses, laws and sections dynamically using tool.
      - Ensure the document aligns with the user's purpose (business, service agreement, legal relief, etc.)
  agent: drafting_agent

modifier_task:
  description: >
    Your task is to carefully review the petition or contract uploaded by the lawyer or draft attached in prompt by the drafting_agent. And modify, change or add specific requests in draft generated by the drafting_agent or document uploaded by the lawyer's . 
    - If the lawyer has requested changes, incorporate them precisely while maintaining the integrity of the legal argument and contract structure.
    - If the lawyer has not requested specific modifications but general improvements are needed, refine the petition to enhance clarity, consistency, and readability.
    - Ensure that legal provisions remain coherent, enforceable, and free of ambiguity.
    - Cross-check all references to statutes, case law, or contractual clauses to prevent inconsistencies or misinterpretations.
    - Preserve the document’s original intent while improving its logical flow, precision, and legal robustness.
    Ensure that changes align with legal compliance and contractual enforceability.
    Ensure modified draft maintains the original structure, formatting, and essential clauses.
    If lawyer asks for further modifications you need any document check history apply modifications.
    Always apply any modifications on last response.
    Previous conversation:{history}
    Current query:{query}
    Document:{document}
  expected_output: >
    A well-structured, legally precise, and professionally formatted petition or contract that:
    - Incorporates all requested modifications seamlessly.
    - Maintains legal clarity, consistency, and compliance.
    - Uses professional legal language and formatting.
    - Enhances the overall readability and persuasiveness of the document.
  agent: modifier_agent

findings_task:
  description: >
    Your task is to analyze and compare legal arguments, facts, and rulings across the uploaded legal documents provided by the lawyer.

    Handle specific requests as follows:
    - If the lawyer asks for similarities, extract and present them clearly.
    - If the lawyer asks for differences, extract and present them clearly.
    - If the lawyer asks for key findings, highlight the most significant legal conclusions and insights.
    - If the lawyer asks for suggestions, offer relevant legal strategies or improvements.
    - If the lawyer asks for strengths or weaknesses, identify the legal advantages, risks, and vulnerabilities within the documents.
    - If the lawyer does not ask for anything specific, provide all of the above (similarities, differences, findings, suggestions, strengths, and weaknesses).
    Respond strictly based on the lawyer’s query — do not provide additional insights beyond what was asked.
    Input query: {query}{document}
    Previous conversation:{history}
  expected_output: >
    A structured, intent-specific comparison or legal findings from the contract(s) or petition(s), clearly addressing the lawyer’s precise request.
  agent: findings_agent

summary_task:
  description: >
    Your task is to answer general query and produce a concise summary by carefully reading the shared contract or petition.
    If lawyer asked for summary:
      For contracts, extract and summarize:
        - Title of the contract
        - Parties involved
        - Purpose of the agreement
        - Key obligations or services
        - Financial or legal obligations
        - Term & Termination
        - Risky or missing clauses
        - Governing law

      For petitions, extract and summarize:
        - Case title and court
        - Jurisdiction
        - Parties (Petitioner and Respondent/Defendant)
        - Legal issue or violation (statute, if any)
        - Key facts and timeline
        - Legal counts or claims
        - Relief/prayer requested
    If lawyer asked for any specific thing from the document answer accordingly.
    Respond only with clear, structured bullet points or short paragraphs, avoiding long-form legal language or repetition.
    If query is not for summary answer accordingly.
    If lawyer not provided any document and you need any document use memory.
    Input query:{query}{document}
    Previous conversation:{history}
  expected_output: >
    A concise and structured summary of the contract or petition with highlights of key content, legal exposure, or omissions.
  agent: summary_agent

prediction_task:
  description: >
    Analyze the following case based on the provided prompt and documents by the laywer.
    Your response should include:
    1. A success probability score (%) based on historical data, case factors, and legal arguments.
    2. Provides a summary of key influencing factors that impact the case outcome(evidence strength, jurisdiction, opposing counsel, etc.).
    3. Strategic suggest improvements to legal strategy based on past successful cases.
    Input query:{query}{document}
    Previous conversation:{history}
  expected_output: >
   - Success Probability Score
    - Key Influencing Factors
    - Strategy Recommendations
  agent: score_prediction