drafting_task:
  description: >
    Your are legal drafting agent to draft US legal formal documents (either a contract agreement or a petition) as per the request provided in the prompt that the lawyer provides.
      If it is a contract, use the following structure:
      - Title of the contract(must be in center)
      - Parties: Clearly identify the parties involved, their addresses, and roles.
      - Purpose: Brief description, reason and scope of the contract.
      - Scope of Work/Services: specific tasks or services parties will provide.
      - Term and Termination: 
        - Effective Date: 
        - End Date: [Optional]
        - Termination Clause: conditions under which parties may terminate the contract.
      - Confidentiality: Define obligations not to disclose confidential information.
      - Intellectual Property: Clarify ownership of created materials, rights transfer, etc.
      - Governing Law: U.S. State laws applicable, mention applicable U.S. laws or state statutes wherever relevant.
      - Signature section for both parties.(1 on left side and other on right side)
        - Signature:
        - Name: 
        - Date: 
      - Use formal contractual tone and make sure it is legally coherent and enforceable.

      If it is a Petition, use the following structure:
      - Title of the Petition(must be in center)
      - Addressed to: “TO THE HONORABLE JUDGE OF SAID COURT:”
      - Parties: Petitioner and Respondent details
      - Jurisdiction & Venue
      - Statement of Facts in numbered paragraphs
      - Legal Grounds/Causes of Action
      - Prayer for Relief
      - Signature Block:
         Signature: 
        - Name: 
        - Address: 
        - Date: 
      - Include Verification and Notary (if required)
      - Mention applicable U.S. laws or state statutes wherever relevant.
    Respond in a structured format.  
    Input query:{query}
  expected_output: >
    Draft professional, legally sound documents.
    Include relevant laws, clauses, and sections based on U.S. legal system.
    Ensure the document aligns with the user's purpose (business, service agreement, legal relief, etc.)
  agent: drafting_agent

modifier_task:
  description: >
    Your task is to change, modify or add any specific requests in draft generated by the drafting_agent or document uploaded by the lawyer. 
    - If the lawyer has requested changes, incorporate them precisely while maintaining the integrity of the legal argument and contract structure.
    - If the lawyer has not requested specific modifications but general improvements are needed, refine the petition to enhance clarity, consistency, and readability.
    - Ensure that legal provisions remain coherent, enforceable, and free of ambiguity.
    - Cross-check all references to statutes, case law, or contractual clauses to prevent inconsistencies or misinterpretations.
    - Preserve the document’s original intent while improving its logical flow, precision, and legal robustness.
    Ensure modified drafts maintains the original structure, formatting, and essential clauses.
    Input query:{query}{document}
  expected_output: >
    A well-structured, legally precise, and professionally formatted petition or contract that:
      - Incorporates all requested modifications seamlessly.
      - Maintains legal clarity, consistency, and compliance.
      - Uses professional legal language and formatting.
      - Enhances the overall readability and persuasiveness of the document.
  agent: modifier_agent
  
findings_task:
  description: >
    Your task is to carefully analyze and compare relevant legal arguments, facts, and rulings that align or diverge across the documents.
    On lawyer's specific requests.
      - If the lawyer asks for similarities or differences, extract similarities and differences.
      - If the lawyer asks for key findings, extract the most significant legal conclusions and insights.
      - If the lawyer asks for suggestions, recommend relevant suggestions.
      - If the lawyer asks for strengths or weaknesses, extract advantages, vulnerabilities and strengths or weaknesses comparing documents.
      - If the lawyer asks for sucess score, compare with a winned case based on that provide success probability score (%) of a case based on historical data, case factors, and legal arguments, provides a summary of key influencing factors for succes that impact the case outcome(evidence strength, jurisdiction, opposing counsel, etc.) and provide Strategic suggest improvements for success to legal strategy based on past successful cases.
    The agent should not attach any draft or table to the response.
    Input query:{query}{document}
  expected_output: >
      Similarities : Shared legal issues, arguments, facts, and rulings.
      Differences : Diverging arguments, legal interpretations, or case outcomes.
      Key Findings : Important conclusions drawn from the documents.
      Relevant Precedents : Suggested U.S. Federal cases or rulings that may support the findings.
      Insights and Recommendations : Strategic notes for legal professionals based on the comparison.
  output_example: >
    Similarities:
    - Both cases argue violation of First Amendment rights.
    - Each includes jurisdiction in the Southern District of New York.

    Differences:
    - Case A focuses on employment discrimination, while Case B centers on educational rights.
    - Respondent in Case A is a private entity, while in Case B it is a public university.

    Key Findings:
    - Case B has stronger precedent support from the 2019 Smith v. NYU ruling.
  agent: findings_agent

Summary_task:
  description: >
    Your task is to produce a concise, bullet-point summary by carefully reading the shared contract or petition.
    For contracts, extract and summarize:
      - Parties involved
      - Purpose of the agreement
      - Key obligations or services
      - Financial or legal obligations
      - Term & Termination
      - Risky or missing clauses
      - Governing law

    For petitions, extract and summarize:
      - Case title and court
      - Jurisdiction
      - Parties (Petitioner and Respondent/Defendant)
      - Legal issue or violation (statute, if any)
      - Key facts and timeline
      - Legal counts or claims (e.g., Count I, II)
      - Relief/prayer requested
    Respond only with clear, structured bullet points or short paragraphs, avoiding long-form legal language or repetition.
    Input query:{query}{document}
  expected_output: >
    A concise and structured summary of the contract or petition with highlights of key content, legal exposure, or omissions.
  output_example: >
    Case Summary:

    - Case Title: John Doe v. XYZ Corporation
    - Jurisdiction: U.S. District Court, Northern District of California
    - Parties: John Doe (Petitioner) vs. XYZ Corp (Respondent)
    - Legal Issue: Breach of contract under California Civil Code § 3300
    - Key Facts:
      - Contract signed on Jan 5, 2023
      - Breach occurred on March 15, 2023
    - Claims:
      - Breach of contract
      - Unjust enrichment
    - Relief Sought: $250,000 in damages and injunctive relief

  agent: Summary_agent
